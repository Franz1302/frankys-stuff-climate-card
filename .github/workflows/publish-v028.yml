name: Publish Climate Card v0.2.10
on:
  workflow_run:
    workflows: ["HACS Validation"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate JavaScript and regression tests
        run: |
          node --check frankys-stuff-climate-card.js
          node --check jarvis-climate-card-legacy.js
          node tests/auto-mode.test.js
          node tests/mode-actions.test.js
          node tests/thermostat-helpers.test.js
      - name: Publish HACS release after verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$VERIFIED_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Skipping superseded validation run: main moved."
            exit 0
          fi
          grep -q 'Standalone v0.2.10' frankys-stuff-climate-card.js
          grep -q 'Standalone v0.2.10' jarvis-climate-card-legacy.js
          if gh release view v0.2.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.10 already exists."
            exit 0
          fi
          gh release create v0.2.10 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "Frankys_Stuff Climate Card v0.2.10 — External Thermostat Helpers" \
            --notes "Adds optional thermostat operating-mode and target-temperature helper selectors (mode_entity/target_entity) in the graphical editor. Configured mode helpers control AUS/AUTO/MANUELL, with no fallback commands when unavailable. Explicit mode actions still take priority. Existing thermostat configurations without helpers are unchanged. Retains the v0.2.9 temperature sensor selector. JavaScript regression tests and HACS validation passed."
